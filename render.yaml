# Render Blueprint — BuildStack Construction LLC (production)
#
# This is the live production deploy. Background workers (permit importer,
# lead scanner, loan outreach, enrichment, bid autopilot) are all ON.
# Auto-reply sends directly to leads through the Gmail transport.
#
# DISABLE_* flags: the code reads them as `if not os.getenv("DISABLE_X")`,
# so ANY non-empty value disables the worker. Render stores booleans as
# the strings "true"/"false", and "false" is truthy in Python — so to
# disable a worker, set these to "true", never "false".
#
# All secrets use `sync: false` — Render asks for the value in the
# dashboard on first deploy and never stores it in git.

envVarGroups:
  - name: construction-secrets
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # Outbound email. Gmail is the lead transport.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # Uploads. Render's filesystem is ephemeral — without R2 every
      # deploy deletes crew photos. R2 is required.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      # Voice/SMS.
      - key: SIGNALWIRE_PROJECT_ID
        sync: false
      - key: SIGNALWIRE_API_TOKEN
        sync: false
      - key: SIGNALWIRE_SPACE_URL
        sync: false
      - key: SIGNALWIRE_PHONE
        sync: false

      # Vapi voice bot.
      - key: VAPI_API_KEY
        sync: false

      # Lead enrichment / skip trace.
      - key: RENTCAST_API_KEY
        sync: false
      - key: SHOVELS_API_KEY
        sync: false
      - key: SKIP_SHERPA_API_KEY
        sync: false
      - key: SCRAP_IO_API_KEY
        sync: false

      # Zoho CRM/Books/Mail/Campaigns.
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false

      # Stripe (legacy deposit links still work; primary path is PNC Zelle/ACH).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Bank encryption key for crew direct deposit details.
      - key: BANK_ENCRYPTION_KEY
        sync: false

databases:
  - name: bizstack-construction-db
    databaseName: construction
    user: construction
    region: virginia
    # Paid tier — Render deletes free Postgres 30 days after creation.
    plan: 0.1c-256mb
    postgresMajorVersion: "18"

services:
  - type: web
    name: bizstack-construction
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: virginia
    # 2 GB: the app imports ~190 modules and starts eight background
    # threads at boot. 512 MB OOM-kills mid-startup.
    plan: 1c-2g
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bizstack-construction-db
          property: connectionString

      - fromGroup: construction-secrets

      # --- identity ---------------------------------------------------------
      - key: ADMIN_EMAIL
        value: hello@bizstackperks.com
      - key: ADMIN_NAME
        value: Owner
      - key: COMPANY_NAME
        value: BuildStack Construction LLC
      # Customer-facing number only. 252-665-5891 is Shaun's personal mobile
      # and belongs on lending material alone.
      - key: COMPANY_PHONE
        value: +1 (757) 908-7121
      - key: COMPANY_EMAIL
        value: hello@bizstackperks.com
      - key: COMPANY_DOMAIN
        value: construction.bizstackperks.com
      - key: SERVICE_AREA
        value: Williamsburg–Hampton Roads, VA · Currituck County & Elizabeth City, NC
      - key: APP_TIMEZONE
        value: America/New_York

      # --- owner mobile for SMS lead alerts ---------------------------------
      # Set this to the phone the owner carries on job sites. When a lead
      # arrives, auto_reply texts this number with the lead's name, phone,
      # and project type so the owner can call back immediately.
      # Format: +1XXXXXXXXXX
      - key: OWNER_MOBILE
        sync: false

      # --- contractor license (shown in footer, hero badge, About page) -----
      - key: CONTRACTOR_LICENSE
        sync: false

      # --- auth -------------------------------------------------------------
      - key: APP_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: OTP_ENABLED
        value: "true"

      # --- background workers: ALL ON for production ------------------------
      # To temporarily disable a worker, add the flag with value "true".
      # DISABLE_PERMIT_IMPORT, DISABLE_LEAD_SCAN, DISABLE_LOAN_OUTREACH,
      # DISABLE_LEAD_ENRICH, DISABLE_BID_AUTOPILOT are all intentionally
      # absent — their absence means the workers run.

      # --- auto-reply: production sends directly ----------------------------
      - key: LEAD_AUTO_SEND
        value: "1"

      # --- skip trace enrichment: limited to avoid burning RentCast budget --
      - key: SKIPTRACE_ENRICH_MAX
        value: "10"

      # --- outbound volume caps ---------------------------------------------
      - key: EMAIL_DAILY_CAP
        value: "150"
      - key: TEXT_DAILY_CAP
        value: "30"

      # --- model ------------------------------------------------------------
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # --- mail identity ----------------------------------------------------
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        value: hello@bizstackperks.com
      - key: SMTP_NAME
        value: BuildStack Construction
      - key: SMTP_TLS
        value: "true"
      - key: SENDER_PHYSICAL_ADDRESS
        value: BuildStack Construction LLC, 701 Dana Dr, Chesapeake, VA 23321. To stop receiving email from us, reply "unsubscribe" and we will remove your address.

      # --- letter brand -----------------------------------------------------
      - key: LETTER_BRAND_NAME
        value: BuildStack Construction
      - key: LETTER_BRAND_LEGAL
        value: BuildStack Construction LLC
      - key: LETTER_BRAND_PHONE
        value: 252-665-5891
      - key: LETTER_BRAND_EMAIL
        value: hello@bizstackperks.com
      - key: LETTER_BRAND_WEB
        value: construction.bizstackperks.com
      - key: LETTER_BRAND_STREET
        value: 701 Dana Dr
      - key: LETTER_BRAND_CITYSTATEZIP
        value: Chesapeake, VA 23321

      # --- rentcast budget --------------------------------------------------
      - key: RENTCAST_MONTHLY_LIMIT
        value: "50"

      # --- email transport --------------------------------------------------
      - key: EMAIL_TRANSPORT
        value: gmail
