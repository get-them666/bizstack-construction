[pytest]
# Two untracked directories sit inside this repo and neither belongs to it.
# Both contain test files, and both abort collection for the whole suite
# before a single test of ours runs:
#
#   bizstack-construction/  test_deposit_atomicity.py raises SystemExit(0) at
#                           import -> INTERNALERROR
#   bizstack-perks/         test_dial.py imports twilio, which is not installed
#                           -> ModuleNotFoundError
#
# Neither has any git-tracked file, so this excludes them rather than touching
# anything on disk. Delete them when you no longer need them.
norecursedirs = .git venv .venv bizstack-construction bizstack-perks node_modules __pycache__ *.egg-info outbox static docs templates
python_files = test_*.py
filterwarnings =
    default